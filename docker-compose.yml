version: "3.8"

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
    networks:
      - ev-charging

  server:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - ALLOWED_ORIGINS=http://localhost:5000
    depends_on:
      - livekit
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
    networks:
      - ev-charging

  agent:
    build: .
    command: python backend/voice_agent.py start
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      - livekit
    volumes:
      - ./data:/app/data
    networks:
      - ev-charging

networks:
  ev-charging:
    driver: bridge
